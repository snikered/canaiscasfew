name: Atualizar EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9,21 * * *" # Roda 2x por dia: 06:37 e 18:37 (horário de Brasília)

permissions:
  contents: write

concurrency:
  group: atualizar-epg
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: "America/Sao_Paulo"
      PYTHONUNBUFFERED: "1"
      DOWNLOAD_WORKERS: "4"
      GZIP_LEVEL: "9"
      OUTPUT_PAST_HOURS: "6"
      OUTPUT_FUTURE_HOURS: "72"
      CHANNELS_FILE: "channels.json"
      MAX_WEB_LOOKUPS_PER_RUN: "200"

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de Extração
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pytz cloudscraper urllib3

      - name: Recuperar Espelho e Cache de Metadados (da branch epg)
        run: |
          git fetch origin epg:epg 2>/dev/null || true
          git checkout epg -- espelho.json 2>/dev/null || true
          git checkout epg -- metadata_cache.json 2>/dev/null || true

      - name: Rodar Todos os Extratores (Em Paralelo + Tolerante a Falhas)
        run: |
          for script in fetch_claro_epg.py fetch_vivo_epg.py fetch_globoplay_epg.py guiadetv.py meuguia.py tvplus.py tvmap.py mitv.py webfinal.py; do
            if [ -f "$script" ]; then
              (timeout 12m python3 "$script" || echo "⚠ Aviso: $script terminou com erro/timeout, mas o pipeline continuará.") &
            fi
          done
          wait
          echo "✓ Todos os extratores locais e de operadoras foram finalizados."

      - name: Compilar e Higienizar Dicionário (Preservando Esportes/PPV e Filmes/Séries ao vivo)
        run: |
          if [ -f "compile_dictionary.py" ]; then
            python3 compile_dictionary.py
          fi
          python3 - << 'EOF'
          import json, re
          from pathlib import Path

          p = Path("channels.json")
          if p.exists():
              data = json.loads(p.read_text("utf-8"))
              channels = data.get("channels", []) if isinstance(data, dict) else data

              # Lixo real que nunca tem guia de TV (VOD, 24h, Rádios, Adultos, Câmeras avulsas)
              JUNK_GROUPS = {
                  "VOD", "ON DEMAND", "LANCAMENTO", "LANÇAMENTO",
                  "24H", "24HS", "24 HORAS", "ADULTO", "XXX", "RADIOS", "RÁDIOS",
              }
              JUNK_NAME_RE = re.compile(
                  r'(\b24\s*H(?:S|ORAS)?\b|\bS\d{1,2}\s*E\d{1,3}\b|\bT\d{1,2}\s*EP?\d{1,3}\b|\bCAM\s*\d+\b|\bMOSAICO\b|\bTESTE\b|\bR[AÁ]DIO\b|\b\d{2,3}[.,]\d\s*FM\b|\bFM\s*\d{2,3}|\bAM\s*\d{3,4}\b|^[0-9\W_]+$)',
                  re.IGNORECASE
              )
              # Canais ao vivo sempre protegidos
              PROTECTED_RE = re.compile(
                  r'(PREMIERE|SPORTV|ESPN|COMBATE|BAND\s*SPORTS|FOX\s*SPORTS|TNT|CAZ[EÉ]|GOAT|DAZN|PARAMOUNT|DISNEY|MAX|HBO|TELECINE|CINEMAX|MEGAPIX|WARNER|SPACE|AXN|SONY|UNIVERSAL|AMC|A&E|TCM|LIFETIME|UFC|FIGHT|CONMEBOL|LIBERTADORES|SULAMERICANA|PAULIST[AÃ]O|CARIOCA|COPA|FUTEBOL|NOS+O\s*FUTEBOL|SPORTYNET|X\s*SPORTS|NBA|NFL|MLB|F1|MOTOR)',
                  re.IGNORECASE
              )

              cleaned = []
              removed = 0
              for ch in channels:
                  if not isinstance(ch, dict):
                      continue
                  name = str(ch.get("name", "")).strip()
                  groups = " | ".join(str(g) for g in (ch.get("groups", []) or [ch.get("group", "")])).upper()

                  if PROTECTED_RE.search(name) or PROTECTED_RE.search(groups):
                      cleaned.append(ch)
                      continue

                  if any(jg in groups for jg in JUNK_GROUPS) or JUNK_NAME_RE.search(name):
                      removed += 1
                      continue

                  entries_cnt = int(ch.get("playlist_entries", 2))
                  old_ids = ch.get("old_tvg_ids", []) or ch.get("tvg_ids_to_export", [])
                  if entries_cnt <= 1 and not old_ids and len(name) > 28:
                      removed += 1
                      continue

                  cleaned.append(ch)

              if isinstance(data, dict):
                  data["channels"] = cleaned
                  data["channel_count"] = len(cleaned)
              else:
                  data = {"channels": cleaned}
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", "utf-8")
              print(f"Limpeza concluída: {removed} lixos/VODs removidos. {len(cleaned)} canais mantidos!")
          EOF

      - name: Gerar EPG Costurado e Consolidado
        run: |
          python3 merge_epg.py

      - name: Auditar EPG e Gerar Diagnóstico de Falhas
        run: |
          if [ -f "audit_epg.py" ]; then
            python3 audit_epg.py output/epg.xml.gz --report output/report.json --validation output/validation.json --out-md output/audit.md --out-json output/audit.json || true
          fi

      - name: Publicar EPG, Espelho e Cache de Metadados na branch epg
        run: |
          set -e
          if [ ! -f "output/epg.xml.gz" ]; then
            echo "Erro: output/epg.xml.gz não foi gerado!"
            exit 1
          fi

          mkdir -p /tmp/epg_publish
          cp output/epg.xml.gz /tmp/epg_publish/epg.xml.gz
          for f in espelho.json report.json report.md validation.json validation.md audit.md audit.json; do
            if [ -f "output/$f" ]; then
              cp "output/$f" "/tmp/epg_publish/$f"
            fi
          done
          if [ -f "metadata_cache.json" ]; then
            cp metadata_cache.json /tmp/epg_publish/metadata_cache.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan publicacao-epg
          git rm -rf .

          cp /tmp/epg_publish/* .

          echo "# EPG Consolidado" > README.md
          echo "Atualizado automaticamente via GitHub Actions." >> README.md

          git add epg.xml.gz README.md
          for f in espelho.json report.json report.md validation.json validation.md audit.md audit.json metadata_cache.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done

          git commit -m "Atualiza EPG multi-fonte, Espelho e Cache de Metadados"
          git push --force origin HEAD:epg
