name: Atualizar EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # Roda a cada 6 horas automaticamente

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      DOWNLOAD_WORKERS: "4"
      GZIP_LEVEL: "9"
      OUTPUT_PAST_HOURS: "6"
      OUTPUT_FUTURE_HOURS: "72"
      CHANNELS_FILE: "channels.json"
      MAX_WEB_LOOKUPS_PER_RUN: "200"

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências de Extração
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pytz cloudscraper urllib3

      - name: Rodar Extratores (Em Paralelo)
        run: |
          set -e
          for script in guiadetv.py meuguia.py tvmap.py tvplus.py mitv.py; do
            if [ -f "$script" ]; then
              python3 "$script" &
            fi
          done
          wait
          echo "Todos os extratores locais foram finalizados."

      - name: Compilar dicionário persistente
        run: |
          if [ -f "compile_dictionary.py" ]; then
            python3 compile_dictionary.py
          fi

      - name: Recuperar Espelho e Cache de Metadados (da branch epg)
        run: |
          git fetch origin epg:epg 2>/dev/null || true
          git checkout epg -- espelho.json 2>/dev/null || true
          git checkout epg -- metadata_cache.json 2>/dev/null || true

      - name: Gerar EPG Costurado e Consolidado
        run: |
          python3 merge_epg.py

      - name: Publicar EPG, Espelho e Cache de Metadados na branch epg
        run: |
          set -e
          if [ ! -f "output/epg.xml.gz" ]; then
            echo "Erro: output/epg.xml.gz não foi gerado!"
            exit 1
          fi
          
          # Copia o metadata_cache.json gerado para a pasta output antes de limpar a árvore
          if [ -f "metadata_cache.json" ]; then
            cp metadata_cache.json output/metadata_cache.json
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan publicacao-epg
          git rm -rf .
          
          cp output/epg.xml.gz epg.xml.gz
          cp output/espelho.json espelho.json
          cp output/report.json report.json
          cp output/report.md report.md
          cp output/validation.json validation.json
          cp output/validation.md validation.md
          if [ -f "output/metadata_cache.json" ]; then
            cp output/metadata_cache.json metadata_cache.json
          fi
          
          echo "# EPG Consolidado" > README.md
          echo "Atualizado automaticamente via GitHub Actions." >> README.md
          
          git add epg.xml.gz espelho.json report.json report.md validation.json validation.md README.md
          if [ -f "metadata_cache.json" ]; then
            git add metadata_cache.json
          fi
          git commit -m "Atualiza EPG multi-fonte, Espelho e Cache de Metadados"
          git push --force origin HEAD:epg
