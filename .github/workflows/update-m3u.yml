name: Atualizar EPG Universal

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7,19 * * *"
      timezone: "America/Maceio"

permissions:
  contents: write

concurrency:
  group: atualizar-epg-universal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      DOWNLOAD_WORKERS: "4"
      GZIP_LEVEL: "6"
      OUTPUT_PAST_HOURS: "12"

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          
      - name: Instalar dependências de Extração
        run: pip install requests beautifulsoup4

      - name: Rodar Extratores (Em Paralelo)
        run: |
          set -e
          python tvplus.py &
          python tvmap.py &
          python mitv.py &
          python meuguia.py &
          python guiadetv.py &
          python urbantv.py &
          wait
          echo "Todos os extratores locais foram finalizados."

      - name: Compilar dicionário persistente
        shell: bash
        run: |
          set -euo pipefail
          python compile_dictionary.py --catalog channels.json
          echo "CHANNELS_FILE=channels.json" >> "$GITHUB_ENV"

      - name: Recuperar Espelho (Cache de Segurança)
        run: |
          echo "Tentando baixar o espelho de segurança da nuvem..."
          curl -s -f -o espelho.json https://raw.githubusercontent.com/${{ github.repository }}/epg/espelho.json || echo '{"channels": []}' > espelho.json

      - name: Gerar EPG Costurado e Consolidado
        env:
          M3U_URL_1: ${{ secrets.M3U_URL_1 }}
          M3U_URL_2: ${{ secrets.M3U_URL_2 }}
          M3U_URL_3: ${{ secrets.M3U_URL_3 }}
        run: python merge_epg.py

      - name: Publicar EPG e Espelho na branch epg
        shell: bash
        run: |
          set -e
          rm -rf /tmp/epg-publicado
          mkdir -p /tmp/epg-publicado
          cp output/epg.xml.gz /tmp/epg-publicado/epg.xml.gz
          cp output/report.md /tmp/epg-publicado/report.md
          cp output/report.json /tmp/epg-publicado/report.json
          cp output/validation.md /tmp/epg-publicado/validation.md
          cp output/validation.json /tmp/epg-publicado/validation.json
          cp output/espelho.json /tmp/epg-publicado/espelho.json || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publicacao-epg
          git rm -rf .
          cp /tmp/epg-publicado/* .
          printf '# EPG Universal com Scrapers Locais + APIs Abertas\n\nGeração unificada por consenso de 16 fontes.\n' > README.md
          git add epg.xml.gz report.md report.json validation.md validation.json README.md espelho.json
          git commit -m "Atualiza EPG multi-fonte e Espelho"
          git push --force origin HEAD:epg
