name: Atualizar EPG Universal

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"
      timezone: "America/Maceio"

permissions:
  contents: write

concurrency:
  group: atualizar-epg-universal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Compatibilidade: uma URL única.
      M3U_URL: ${{ secrets.M3U_URL }}
      # Universal multi-lista: uma URL por linha. Opcional: NOME|https://url...
      M3U_URLS: ${{ secrets.M3U_URLS }}

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Baixar e catalogar todas as M3Us pelo nome
        shell: bash
        run: |
          set -euo pipefail
          EPG_PUBLIC_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/epg/epg.xml.gz"
          mkdir -p /tmp/playlists /tmp/fixed-playlists

          python - <<'PY'
          import os, pathlib, re, urllib.request

          out = pathlib.Path('/tmp/playlists')
          rows = []
          legacy = os.environ.get('M3U_URL', '').strip()
          if legacy:
              rows.append(('principal', legacy))

          for i, raw in enumerate(os.environ.get('M3U_URLS', '').splitlines(), 1):
              raw = raw.strip()
              if not raw or raw.startswith('#'):
                  continue
              if '|' in raw:
                  name, url = raw.split('|', 1)
                  name, url = name.strip(), url.strip()
              else:
                  name, url = f'lista-{i:02d}', raw
              if url:
                  rows.append((name, url))

          # Remove URLs repetidas sem expô-las no log.
          unique = []
          seen = set()
          for name, url in rows:
              if url in seen:
                  continue
              seen.add(url)
              unique.append((name, url))

          for i, (name, url) in enumerate(unique, 1):
              safe = re.sub(r'[^A-Za-z0-9._-]+', '-', name).strip('-._') or f'lista-{i:02d}'
              path = out / f'{i:02d}-{safe}.m3u'
              req = urllib.request.Request(url, headers={'User-Agent': 'EPG-Universal/2.0'})
              with urllib.request.urlopen(req, timeout=180) as r:
                  data = r.read()
              path.write_bytes(data)
              print(f'Lista {i}: {len(data)} bytes baixados como {path.name}')
          PY

          shopt -s nullglob
          FILES=(/tmp/playlists/*.m3u)

          # Também aceita playlists locais no repo, útil em repositório PRIVADO.
          if [ ${#FILES[@]} -eq 0 ]; then
            [ -f playlist.m3u ] && cp playlist.m3u /tmp/playlists/00-playlist.m3u
            for f in playlists/*.m3u; do
              [ -f "$f" ] || continue
              cp "$f" "/tmp/playlists/local-$(basename "$f")"
            done
            FILES=(/tmp/playlists/*.m3u)
          fi

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERRO: nenhuma M3U configurada. Cadastre M3U_URL ou M3U_URLS em Settings > Secrets and variables > Actions."
            echo "A v9 não usa channels.json antigo como fallback, para impedir catálogo desatualizado."
            exit 1
          fi

          python extract_channels.py "${FILES[@]}" \
            --catalog /tmp/channels-universal.json \
            --fixed-dir /tmp/fixed-playlists \
            --epg-url "$EPG_PUBLIC_URL"

          echo "CHANNELS_FILE=/tmp/channels-universal.json" >> "$GITHUB_ENV"
          echo "FIXED_PLAYLIST_DIR=/tmp/fixed-playlists" >> "$GITHUB_ENV"

      - name: Gerar EPG universal por nome e consenso de 5 fontes
        run: python merge_epg.py

      - name: Informar sobre listas corrigidas
        if: ${{ env.FIXED_PLAYLIST_DIR != '' }}
        shell: bash
        run: |
          echo "As M3Us corrigidas foram geradas apenas temporariamente em /tmp/fixed-playlists."
          echo "Elas NÃO são publicadas para evitar expor URLs/credenciais."
          echo "O EPG publicado inclui IDs antigos exclusivos e aliases de nome para entradas sem tvg-id."

      - name: Publicar somente EPG e relatórios na branch epg
        shell: bash
        run: |
          set -e
          rm -rf /tmp/epg-publicado
          mkdir -p /tmp/epg-publicado
          cp output/epg.xml.gz /tmp/epg-publicado/epg.xml.gz
          cp output/report.md /tmp/epg-publicado/report.md
          cp output/report.json /tmp/epg-publicado/report.json
          cp output/validation.md /tmp/epg-publicado/validation.md
          cp output/validation.json /tmp/epg-publicado/validation.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan publicacao-epg
          git rm -rf .
          cp /tmp/epg-publicado/* .
          printf '# Saída automática do EPG Universal\n\nIdentificação por nome + consenso de 5 fontes + compatibilidade multi-M3U.\n' > README.md
          git add epg.xml.gz report.md report.json validation.md validation.json README.md
          git commit -m "Atualiza EPG universal automático"
          git push --force origin HEAD:epg
