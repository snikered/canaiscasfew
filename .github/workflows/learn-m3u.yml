name: Aprender Listas M3U

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.m3u"
      - "**.m3u8"
      - "learning/**"

permissions:
  contents: write

jobs:
  aprender:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extrair canais de todos os .m3u e proteger credenciais
        run: |
          python3 - << 'EOF'
          import glob, json, re, subprocess
          from pathlib import Path

          m3u_files = sorted(set(
              glob.glob("*.m3u") + glob.glob("*.m3u8") +
              glob.glob("learning/*.m3u") + glob.glob("learning/*.m3u8") +
              glob.glob("**/*.m3u", recursive=True)
          ))

          print(f"Arquivos M3U encontrados ({len(m3u_files)}): {m3u_files}")
          if not m3u_files:
              print("Nenhum arquivo .m3u encontrado.")
              exit(0)

          VOD_BLACKLIST = {"VOD", "PLAYBACK", "XXX", "ADULTO", "EVENTO", "LANCAMENTO", "LANÇAMENTO", "FILMES", "SERIES", "SÉRIES"}
          
          def strip_qualities(name):
              s = re.sub(r'\[.*?\]|\(.*?\)|\|.*?\|', ' ', name or "")
              s = re.sub(r'[\¹\²\³\⁴]', '', s)
              tags = r'\b(SD|HD|FHD|UHD|4K|8K|H\.?264|H\.?265|HEVC|HDR\+?|LEG|LEGENDADO|DUB|DUBLADO|HQ|VIP|VOD|24H[S]?|24/7|1080P|720P|60FPS|PPV|EVENTOS?|ALTERNATIVO|BACKUP)\b[\*\²\³\¹\⁴\+]*'
              s = re.sub(tags, ' ', s, flags=re.I)
              s = re.sub(r'[*=_\-]', ' ', s)
              return ' '.join(s.split()).strip()

          def load_existing(path_str):
              p = Path(path_str)
              if not p.exists(): return {}
              try:
                  data = json.loads(p.read_text("utf-8"))
                  ch_list = data.get("channels", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
                  out = {}
                  for c in ch_list:
                      if isinstance(c, dict) and (c.get("id") or c.get("name")):
                          raw_n = str(c.get("name", c.get("id"))).strip()
                          base_key = strip_qualities(raw_n).upper() or raw_n.upper()
                          if base_key not in out:
                              out[base_key] = {
                                  "id": str(c.get("id", raw_n)).strip(),
                                  "name": strip_qualities(raw_n) or raw_n,
                                  "aliases": set(c.get("aliases", []) or []),
                                  "tvg_ids_to_export": set(c.get("tvg_ids_to_export", []) or []),
                                  "group": str(c.get("group", c.get("group-title", ""))).strip()
                              }
                          else:
                              out[base_key]["aliases"].update(c.get("aliases", []) or [])
                              out[base_key]["tvg_ids_to_export"].update(c.get("tvg_ids_to_export", []) or [])
                  return out
              except Exception as e:
                  print(f"Aviso ao ler {path_str}: {e}")
                  return {}

          merged = {**load_existing("espelho.json"), **load_existing("channels.json")}
          total_learned = 0

          for m3u_path in m3u_files:
              print(f"Processando e higienizando: {m3u_path}")
              sanitized_lines = ["#EXTM3U"]
              with open(m3u_path, "r", encoding="utf-8", errors="ignore") as f:
                  current_extinf = None
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      if line.startswith("#EXTINF:"):
                          current_extinf = line
                      elif (line.startswith("http") or line.startswith("rtmp")) and current_extinf:
                          lower_url = line.split("?")[0].lower()
                          if lower_url.endswith(('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm')):
                              current_extinf = None
                              continue
                          
                          tvg_id_m = re.search(r'tvg-id="(.*?)"', current_extinf, re.I)
                          tvg_name_m = re.search(r'tvg-name="(.*?)"', current_extinf, re.I)
                          group_m = re.search(r'group-title="(.*?)"', current_extinf, re.I)
                          name_m = re.search(r',([^,]*?)$', current_extinf)

                          tvg_id = tvg_id_m.group(1).strip() if tvg_id_m else ""
                          tvg_name = tvg_name_m.group(1).strip() if tvg_name_m else ""
                          group = group_m.group(1).strip() if group_m else ""
                          name = name_m.group(1).strip() if name_m else ""
                          
                          extinf_saved = current_extinf
                          current_extinf = None

                          if any(b in group.upper() for b in VOD_BLACKLIST):
                              continue

                          target = name or tvg_name
                          if not target: continue
                          if re.search(r'\bS\d{1,3}\s*E\d{1,3}\b|\bT\d{1,3}\s*EP?\d{1,3}\b|\b24HS?\b|^24\s*H\b', target.upper()):
                              continue

                          base_clean = strip_qualities(target) or target
                          base_key = base_clean.upper()

                          if base_key not in merged:
                              merged[base_key] = {
                                  "id": base_clean,
                                  "name": base_clean,
                                  "aliases": set(),
                                  "tvg_ids_to_export": set(),
                                  "group": group
                              }
                          if name: merged[base_key]["aliases"].add(name)
                          if tvg_name: merged[base_key]["aliases"].add(tvg_name)
                          if tvg_id: merged[base_key]["tvg_ids_to_export"].add(tvg_id)
                          
                          # Salva apenas a linha EXTINF e uma URL fictícia (remove sua senha do arquivo!)
                          sanitized_lines.append(extinf_saved)
                          sanitized_lines.append("http://stream.local/live.ts")
                          total_learned += 1

              # Sobrescreve o arquivo .m3u removendo VODs e credenciais privadas
              Path(m3u_path).write_text("\n".join(sanitized_lines) + "\n", "utf-8")

          final_list = []
          for k in sorted(merged.keys()):
              v = merged[k]
              final_list.append({
                  "id": v["id"],
                  "name": v["name"],
                  "aliases": sorted(v["aliases"]),
                  "tvg_ids_to_export": sorted(v["tvg_ids_to_export"]),
                  "group": v["group"]
              })

          Path("channels.json").write_text(json.dumps({"channels": final_list}, ensure_ascii=False, indent=2) + "\n", "utf-8")
          Path("espelho.json").write_text(json.dumps({"channels": final_list}, ensure_ascii=False, indent=2) + "\n", "utf-8")
          print(f"Concluído! {total_learned} canais processados -> {len(final_list)} emissoras base salvas no channels.json.")

          if Path("compile_dictionary.py").exists():
              subprocess.run(["python3", "compile_dictionary.py"], check=False)
          EOF

      - name: Salvar Dicionário e M3U Higienizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Aprende canais das listas .m3u e higieniza credenciais"
          git push
