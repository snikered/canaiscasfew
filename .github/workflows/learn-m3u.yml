name: Aprender Listas M3U

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.m3u"
      - "**.m3u8"
      - "learning/**"

permissions:
  contents: write

jobs:
  aprender:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ler todos os arquivos .m3u e atualizar Dicionário
        run: |
          python3 - << 'EOF'
          import glob, json, os, re, subprocess
          from pathlib import Path

          # Busca qualquer arquivo .m3u ou .m3u8 em qualquer pasta (sem precisar renomear)
          m3u_files = sorted(set(
              glob.glob("*.m3u") + glob.glob("*.m3u8") +
              glob.glob("learning/*.m3u") + glob.glob("learning/*.m3u8") +
              glob.glob("**/*.m3u", recursive=True)
          ))

          print(f"Arquivos M3U encontrados ({len(m3u_files)}): {m3u_files}")
          if not m3u_files:
              print("Nenhum arquivo .m3u encontrado.")
              exit(0)

          # Se os scripts originais do repositório existirem, tenta chamá-los para cada arquivo
          if Path("learn_channels.py").exists():
              for f in m3u_files:
                  print(f"Processando {f} com learn_channels.py...")
                  subprocess.run(["python3", "learn_channels.py", f], check=False)

          # Extrator direto e universal para garantir que TODAS as listas .m3u alimentem o channels.json e espelho.json
          VOD_BLACKLIST = {"VOD", "PLAYBACK", "XXX", "ADULTO", "EVENTO", "LANCAMENTO", "LANÇAMENTO", "FILMES", "SERIES", "SÉRIES"}
          
          def load_json_channels(path_str):
              p = Path(path_str)
              if not p.exists(): return {}
              try:
                  data = json.loads(p.read_text("utf-8"))
                  ch_list = data.get("channels", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
                  out = {}
                  for c in ch_list:
                      if isinstance(c, dict) and c.get("id"):
                          cid = str(c["id"]).strip()
                          out[cid] = {
                              "id": cid,
                              "name": str(c.get("name", cid)).strip(),
                              "aliases": set(c.get("aliases", []) or []),
                              "tvg_ids_to_export": set(c.get("tvg_ids_to_export", []) or []),
                              "group": str(c.get("group", c.get("group-title", ""))).strip()
                          }
                  return out
              except Exception as e:
                  print(f"Aviso ao ler {path_str}: {e}")
                  return {}

          catalog = load_json_channels("channels.json")
          espelho = load_json_channels("espelho.json")
          merged = {**espelho, **catalog}

          total_learned = 0
          for m3u_path in m3u_files:
              print(f"Extraindo canais ao vivo de: {m3u_path}")
              with open(m3u_path, "r", encoding="utf-8", errors="ignore") as f:
                  current_extinf = None
                  for line in f:
                      line = line.strip()
                      if not line: continue
                      if line.startswith("#EXTINF:"):
                          current_extinf = line
                      elif (line.startswith("http") or line.startswith("rtmp")) and current_extinf:
                          lower_url = line.split("?")[0].lower()
                          if lower_url.endswith(('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm')):
                              current_extinf = None
                              continue
                          
                          tvg_id_m = re.search(r'tvg-id="(.*?)"', current_extinf, re.I)
                          tvg_name_m = re.search(r'tvg-name="(.*?)"', current_extinf, re.I)
                          group_m = re.search(r'group-title="(.*?)"', current_extinf, re.I)
                          name_m = re.search(r',([^,]*?)$', current_extinf)

                          tvg_id = tvg_id_m.group(1).strip() if tvg_id_m else ""
                          tvg_name = tvg_name_m.group(1).strip() if tvg_name_m else ""
                          group = group_m.group(1).strip() if group_m else ""
                          name = name_m.group(1).strip() if name_m else ""
                          current_extinf = None

                          if any(b in group.upper() for b in VOD_BLACKLIST):
                              continue

                          target = name or tvg_name
                          if not target: continue
                          t_up = target.upper()
                          if re.search(r'\bS\d{1,3}\s*E\d{1,3}\b|\bT\d{1,3}\s*EP?\d{1,3}\b|\b24HS?\b|^24\s*H\b', t_up):
                              continue

                          if target not in merged:
                              merged[target] = {
                                  "id": target,
                                  "name": target,
                                  "aliases": set(),
                                  "tvg_ids_to_export": set(),
                                  "group": group
                              }
                          if name: merged[target]["aliases"].add(name)
                          if tvg_name: merged[target]["aliases"].add(tvg_name)
                          if tvg_id: merged[target]["tvg_ids_to_export"].add(tvg_id)
                          total_learned += 1

          final_list = []
          for v in merged.values():
              final_list.append({
                  "id": v["id"],
                  "name": v["name"],
                  "aliases": sorted(v["aliases"]),
                  "tvg_ids_to_export": sorted(v["tvg_ids_to_export"]),
                  "group": v["group"]
              })

          Path("channels.json").write_text(json.dumps({"channels": final_list}, ensure_ascii=False, indent=2) + "\n", "utf-8")
          Path("espelho.json").write_text(json.dumps({"channels": final_list}, ensure_ascii=False, indent=2) + "\n", "utf-8")
          print(f"Sucesso! {total_learned} entradas lidas. Total consolidado: {len(final_list)} canais.")

          if Path("compile_dictionary.py").exists():
              subprocess.run(["python3", "compile_dictionary.py"], check=False)
          EOF

      - name: Salvar Dicionário e Espelho no Repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels.json espelho.json
          if [ -f channel_dictionary.json ]; then git add channel_dictionary.json; fi
          if [ -f learned_ids.json ]; then git add learned_ids.json; fi
          git diff --cached --quiet || git commit -m "Atualiza dicionário com novas listas .m3u"
          git push
