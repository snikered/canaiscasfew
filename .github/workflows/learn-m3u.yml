name: Aprender Listas M3U

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.m3u"
      - "**.m3u8"
      - "learning/**"

permissions:
  contents: write

jobs:
  aprender:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extrair canais de todos os .m3u e proteger credenciais
        run: |
          python3 - << 'EOF'
          import glob, html, json, re, subprocess
          from pathlib import Path

          for p_str in glob.glob("learning/*.m3u") + glob.glob("learning/*.m3u8") + glob.glob("*.m3u"):
              p = Path(p_str)
              if p.exists() and p.stat().st_size < 50:
                  print(f"Arquivo {p_str} está vazio ({p.stat().st_size} bytes). Buscando versão original no histórico do Git...")
                  try:
                      commits = subprocess.check_output(["git", "log", "--format=%H", "--", p_str], text=True).splitlines()
                      for c_sha in commits:
                          content = subprocess.check_output(["git", "show", f"{c_sha}:{p_str}"], text=True, errors="ignore")
                          if len(content.strip()) > 100:
                              p.write_text(content, "utf-8")
                              print(f"  -> Restaurado com sucesso do commit {c_sha[:7]} ({len(content)} bytes)!")
                              break
                  except Exception as e:
                      print(f"  -> Não foi possível restaurar via git log: {e}")

          m3u_files = sorted(set(
              glob.glob("*.m3u") + glob.glob("*.m3u8") +
              glob.glob("learning/*.m3u") + glob.glob("learning/*.m3u8") +
              glob.glob("**/*.m3u", recursive=True)
          ))

          print(f"Arquivos M3U encontrados ({len(m3u_files)}): {m3u_files}", flush=True)
          if not m3u_files:
              print("Nenhum arquivo .m3u encontrado.")
              exit(0)

          VOD_BLACKLIST = {"VOD", "PLAYBACK", "XXX", "ADULTO", "EVENTO", "LANCAMENTO", "LANÇAMENTO", "FILMES", "SERIES", "SÉRIES", "24H", "24HS"}

          def extract_digits(text):
              s = html.unescape(str(text or "")).upper()
              s = re.sub(r"\b(?:H\.?264|H\.?265|1080[PI]?|720P?|60FPS|4K|8K|24H[S]?|24/7|BR\d+|SRV\d+|SERVER\s*\d+|OP[CÇ][AÃ]O\s*\d+)\b", " ", s)
              s = re.sub(r"[¹²³⁴⁵⁶⁷⁸⁹⁰]+", " ", s)
              return re.findall(r"\d+", s)

          def conflicts_number(base_name, candidate):
              bd = extract_digits(base_name)
              cd = extract_digits(candidate)
              if bd != cd:
                  bu = base_name.upper()
                  if ("PREMIERE" in bu or "SPORTV" in bu or "ESPN" in bu) and ((not bd and cd == ["1"]) or (bd == ["1"] and not cd)):
                      return False
                  return True
              return False

          def strip_qualities(name):
              s = html.unescape(name or "")
              # Remove apenas tags de qualidade entre colchetes/parênteses, preservando [2] como número de canal
              s = re.sub(r'\[\s*(?:SD|HD|FHD|UHD|4K|8K|H\.?264|H\.?265|HEVC|AVC|HDR\+?|BR\d*|SRV\d*|SERVER\s*\d*|OP[CÇ][AÃ]O\s*\d*|BACKUP|BKP|ALT|ALTERNATIVO|1080P|720P|60FPS|DUAL|LEG|DUB|P)\s*\]', ' ', s, flags=re.I)
              s = re.sub(r'\(\s*(?:SD|HD|FHD|UHD|4K|8K|H\.?264|H\.?265|HEVC|AVC|HDR\+?|BR\d*|SRV\d*|SERVER\s*\d*|OP[CÇ][AÃ]O\s*\d*|BACKUP|BKP|ALT|ALTERNATIVO|1080P|720P|60FPS|DUAL|LEG|DUB|EVENTOS?|PPV)\s*\)', ' ', s, flags=re.I)
              s = re.sub(r'\|.*?\|', ' ', s)
              s = re.sub(r'\[\s*(\d+)\s*\]', r' \1 ', s)
              s = re.sub(r'\[.*?\]|\(.*?\)', ' ', s)
              s = re.sub(r'[\¹\²\³\⁴\⁵\⁶\⁷\⁸\⁹\⁰\~]', ' ', s)
              tags = r'\b(SD|HD|FHD|UHD|4K|8K|H\.?264|H\.?265|HEVC|AVC|HDR\+?|LEG|LEGENDADO|DUB|DUBLADO|HQ|VIP|VOD|24H[S]?|24/7|1080P|1080I|720P|60FPS|PPV|EVENTOS?|ALTERNATIVO|ALT|BACKUP|BKP|BR\d*)\b[\*\²\³\¹\⁴\+]*'
              s = re.sub(tags, ' ', s, flags=re.I)
              s = re.sub(r'\bH\s+D\b', ' ', s, flags=re.I)
              s = re.sub(r'[*=_\-–—]', ' ', s)
              s = re.sub(r'\.\s*$', '', s)
              return ' '.join(s.split()).strip()

          def load_existing(path_str):
              p = Path(path_str)
              if not p.exists(): return {}
              try:
                  data = json.loads(p.read_text("utf-8"))
                  ch_list = data.get("channels", []) if isinstance(data, dict) else (data if isinstance(data, list) else [])
                  out = {}
                  for c in ch_list:
                      if isinstance(c, dict) and (c.get("id") or c.get("name")):
                          raw_n = html.unescape(str(c.get("name", c.get("id"))).strip())
                          base_clean = strip_qualities(raw_n) or raw_n
                          base_key = base_clean.upper()
                          all_tvg = set(c.get("tvg_ids_to_export", []) or []) | set(c.get("old_tvg_ids", []) or [])
                          valid_aliases = {a for a in (c.get("aliases", []) or []) if not conflicts_number(base_clean, a)}
                          valid_tvg = {t for t in all_tvg if not conflicts_number(base_clean, t)}
                          valid_comp = {cp for cp in (c.get("compatibility_ids", []) or []) if not conflicts_number(base_clean, cp)}
                          valid_src = {sr for sr in (c.get("source_ids", []) or []) if not conflicts_number(base_clean, sr)}
                          if base_key not in out:
                              out[base_key] = {
                                  "id": str(c.get("id", base_clean)).strip(),
                                  "name": base_clean,
                                  "aliases": valid_aliases,
                                  "tvg_ids_to_export": valid_tvg,
                                  "compatibility_ids": valid_comp,
                                  "source_ids": valid_src,
                                  "group": str(c.get("group", c.get("group-title", ""))).strip()
                              }
                          else:
                              out[base_key]["aliases"].update(valid_aliases)
                              out[base_key]["tvg_ids_to_export"].update(valid_tvg)
                              out[base_key]["compatibility_ids"].update(valid_comp)
                              out[base_key]["source_ids"].update(valid_src)
                  return out
              except Exception as e:
                  print(f"Aviso ao ler {path_str}: {e}")
                  return {}

          merged = {**load_existing("espelho.json"), **load_existing("channels.json")}
          total_learned = 0

          for m3u_path in m3u_files:
              p_obj = Path(m3u_path)
              raw_text = p_obj.read_text("utf-8", errors="ignore")
              raw_lines = [ln.strip() for ln in raw_text.splitlines() if ln.strip()]
              print(f"Processando e higienizando: {m3u_path} ({len(raw_lines)} linhas não-vazias)", flush=True)
              
              sanitized_lines = ["#EXTM3U"]
              file_learned = 0
              
              idx = 0
              while idx < len(raw_lines):
                  line = raw_lines[idx]
                  if line.upper().startswith("#EXTINF") or ('tvg-' in line.lower() and ',' in line):
                      extinf_line = line if line.upper().startswith("#EXTINF") else f"#EXTINF:-1 {line}"
                      next_line = raw_lines[idx + 1] if (idx + 1) < len(raw_lines) else ""
                      has_stream_url = next_line.lower().startswith(("http://", "https://", "rtmp://", "rtsp://"))
                      if has_stream_url:
                          idx += 2
                          lower_url = next_line.split("?")[0].lower()
                          if lower_url.endswith(('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm')):
                              continue
                      else:
                          idx += 1

                      tvg_id_m = re.search(r'tvg-id="(.*?)"', extinf_line, re.I)
                      tvg_name_m = re.search(r'tvg-name="(.*?)"', extinf_line, re.I)
                      group_m = re.search(r'group-title="(.*?)"', extinf_line, re.I)
                      name_m = re.search(r',([^,]*?)$', extinf_line)

                      tvg_id = tvg_id_m.group(1).strip() if tvg_id_m else ""
                      tvg_name = html.unescape(tvg_name_m.group(1).strip()) if tvg_name_m else ""
                      group = html.unescape(group_m.group(1).strip()) if group_m else ""
                      name = html.unescape(name_m.group(1).strip()) if name_m else ""

                      if any(b in group.upper() for b in VOD_BLACKLIST):
                          continue

                      target = name or tvg_name
                      if not target:
                          continue
                      if re.search(r'\bS\d{1,3}\s*E\d{1,3}\b|\bT\d{1,3}\s*EP?\d{1,3}\b|\b24HS?\b|^24\s*H\b', target.upper()):
                          continue

                      base_clean = strip_qualities(target) or target
                      base_key = base_clean.upper()

                      if base_key not in merged:
                          merged[base_key] = {
                              "id": base_clean,
                              "name": base_clean,
                              "aliases": set(),
                              "tvg_ids_to_export": set(),
                              "compatibility_ids": set(),
                              "source_ids": set(),
                              "group": group
                          }
                      if name and not conflicts_number(base_clean, name):
                          merged[base_key]["aliases"].add(name)
                      if tvg_name and not conflicts_number(base_clean, tvg_name):
                          merged[base_key]["aliases"].add(tvg_name)
                      if tvg_id and not conflicts_number(base_clean, tvg_id):
                          merged[base_key]["tvg_ids_to_export"].add(tvg_id)
                      if group and not merged[base_key]["group"]:
                          merged[base_key]["group"] = group

                      sanitized_lines.append(extinf_line)
                      sanitized_lines.append("http://stream.local/live.ts")
                      file_learned += 1
                      total_learned += 1
                  else:
                      idx += 1

              if file_learned > 0:
                  p_obj.write_text("\n".join(sanitized_lines) + "\n", "utf-8")
                  print(f"  -> {file_learned} canais extraídos e higienizados de {m3u_path}.", flush=True)
              else:
                  print(f"  -> AVISO: 0 canais extraídos de {m3u_path}. Primeiras 3 linhas do arquivo: {raw_lines[:3]}", flush=True)

          final_list = []
          for k in sorted(merged.keys()):
              v = merged[k]
              exported_tvg = sorted(v["tvg_ids_to_export"])
              final_list.append({
                  "id": v["id"],
                  "name": v["name"],
                  "aliases": sorted(v["aliases"]),
                  "old_tvg_ids": exported_tvg,
                  "tvg_ids_to_export": exported_tvg,
                  "compatibility_ids": sorted(v.get("compatibility_ids", [])),
                  "source_ids": sorted(v.get("source_ids", [])),
                  "group": v["group"]
              })

          Path("channels.json").write_text(json.dumps({"channels": final_list}, ensure_ascii=False, indent=2) + "\n", "utf-8")
          Path("espelho.json").write_text(json.dumps({"channels": final_list}, ensure_ascii=False, indent=2) + "\n", "utf-8")
          print(f"Concluído! {total_learned} entradas M3U lidas -> {len(final_list)} emissoras únicas salvas.", flush=True)

          if Path("compile_dictionary.py").exists():
              subprocess.run(["python3", "compile_dictionary.py"], check=False)
          EOF

      - name: Salvar Dicionário e M3U Higienizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Aprende canais das listas .m3u e higieniza credenciais"
          git push
